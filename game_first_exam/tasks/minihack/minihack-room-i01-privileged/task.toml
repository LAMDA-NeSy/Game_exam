schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, { source = "/var/rcb-monitor/", service = "rcb_monitor" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/minihack-room-i01-privileged"
description = "Reach the down staircase in the native 5x5 room."
keywords = ["game", "minihack", "navigation", "nethack", "privileged-mode"]

[metadata]
task_type = "trajectory"
simulator = "minihack"
robot = "game-agent"
family = "room"
dynamics = "static"
oracle = "full"
instance_seed = 2117382936
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 120.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 1024
storage_mb = 2048

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
