schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/recording.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/vmage-tempestrun-l02-i01-standard"
description = "V-MAGE TempestRun L2 native screenshot episode."
keywords = ["game", "vmage", "navigation", "partial-observation", "standard-mode"]

[metadata]
task_type = "trajectory"
simulator = "vmage"
robot = "game-agent"
family = "l02"
dynamics = "dynamic"
protocol = "game-standard/2.2"
oracle = "partial"
oracle_evidence = "A fixed legal-action trace checks native equivalence and trusted scoring; no positive-score, completion or optimal-policy guarantee."
instance_seed = 0
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 120.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "kill -USR1 $(cat /data/server.pid); i=0; while [ ! -f /data/collection.ready ] && [ $i -lt 30 ]; do sleep 1; i=$((i+1)); done; test -f /data/collection.ready && test -f /data/final.json"
timeout_sec = 40

[agent]
timeout_sec = 600.0
network_mode = "public"

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 1024
storage_mb = 2048

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
