name: slimevolley
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TASK: game_first_exam/tasks/slimevolley/slimevolley-pixel-vs-baseline-i01-standard
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: python -m pip install -e .
      - run: harbor run --game-suite slimevolley --standard --list
      - name: Compare against the pinned native simulator
        run: |
          python scripts/files_image.py build game-files
          python scripts/files_image.py build slimevolley-files
          docker build -t slimevolley-native "$TASK/environment/sim"
          docker run --rm --network none -v "$PWD:/repo:ro" slimevolley-native \
            python /repo/game_first_exam/tests/test_slimevolley_native.py
      - name: Run SlimeVolley with a frozen reference
        run: |
          harbor run --game-suite slimevolley --standard \
            -c configs/harbor/oracle.json --plugin game_harbor:GameRecords \
            --job-name fresh-slimevolley -y
      - name: Check the match and decode the replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          job = Path("jobs/fresh-slimevolley")
          summary = json.loads((job / "game-report/summary.json").read_text())
          assert summary["complete"] and summary["valid_trials"] == 1
          episode, = summary["trials"]
          assert (episode["primary_score"], episode["success"], episode["steps"]) == (1, 1, 3000)
          assert episode["terminal_reason"] == "native_truncated"
          assert json.loads((job / "runtime-images.json").read_text())["complete"]
          PY
          docker run --rm --network none -v "$PWD/jobs:/jobs:ro" slimevolley-native sh -ec \
            '"$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")" -v error -xerror -i /jobs/fresh-slimevolley/*/artifacts/data/replay.mp4 -f null -'
