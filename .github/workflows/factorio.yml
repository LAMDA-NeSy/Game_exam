name: Factorio
on:
  push:
    branches: [factorio-benchmark]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factorio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-regression:
    if: github.ref == 'refs/heads/factorio-benchmark' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: python ci_checks/check-games.py
      - run: python game_first_exam/tests/test_game_harbor.py
      - run: docker build -f game_first_exam/tests/envs/common.Dockerfile -t game-tests:common .
      - run: docker run --rm -v "$PWD:/repo:ro" game-tests:common bash game_first_exam/tests/run.sh common
  factorio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: harbor run --game-suite factorio -a oracle -k 2 -n 2 --ek keep_containers=true --job-name fle-probe -y
      - name: Verify live trial isolation from Docker metadata and native REPL readbacks
        run: python ci_checks/check-factorio-isolation.py jobs/fle-probe
      - name: Exercise the native scorer with a nonzero fixture
        run: |
          docker run --rm --network none --entrypoint /opt/fle-venv/bin/python \
            -v "$PWD/game_first_exam:/checks:ro" \
            game-exam-fle:6439e18b7870770454cf91eb36b3d1e6412724f4 /checks/tests/test_factorio.py
      - name: Show Harbor diagnostics on failure
        if: failure()
        run: |
          if test -d jobs/fle-probe; then
            find jobs/fle-probe -type f \( -name 'exception.txt' -o -name 'trial.log' -o -name 'test-stdout.txt' -o -name 'oracle.txt' \) -exec tail -n 80 {} \;
          fi
