name: games
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ci_checks/check-games.py
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        benchmark: [common, minigrid, crafter, textworld, babaisai, minihack, vmage]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: docker build -f game_first_exam/tests/envs/${{ matrix.benchmark }}.Dockerfile -t game-tests:${{ matrix.benchmark }} .
      - run: docker run --rm -v "$PWD:/repo:ro" game-tests:${{ matrix.benchmark }} bash game_first_exam/tests/run.sh ${{ matrix.benchmark }}
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: harbor run --game-suite minihack-balrog --standard --list
      - run: harbor run --game-suite vmage-smoke --standard --list
      - run: python game_first_exam/tests/test_game_harbor.py
  fresh-clone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # A separate daemon has no game images from adapter jobs or developer machines.
      # Locally assembled files-only images must resolve by their pinned OCI digest.
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: python -m pip install -e .
      - name: Run the README example without model or registry credentials
        run: |
          harbor run --game-suite minihack --standard --family room \
            -c configs/harbor/oracle.json --plugin game_harbor:GameRecords \
            --jobs-dir "$PWD/jobs" --job-name fresh-clone-room -y
      - name: Check native result, collection, provenance and recording
        run: python ci_checks/check-smoke-result.py jobs/fresh-clone-room
      - name: Decode the complete replay
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -v error -i jobs/fresh-clone-room/*/artifacts/data/replay.mp4 -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-clone-room-evidence
          path: jobs/
          retention-days: 7
  fresh-clone-vmage-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Start without cached game images or a preloaded local files image.
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: python -m pip install -e .
      - name: Run one V-MAGE oracle per game without model or registry credentials
        run: |
          harbor run --game-suite vmage-smoke --standard \
            -c configs/harbor/oracle.json --plugin game_harbor:GameRecords \
            --jobs-dir "$PWD/jobs" --job-name fresh-clone-vmage -y
      - name: Check all five scores, end states, and evidence
        run: python ci_checks/check-vmage-smoke-result.py jobs/fresh-clone-vmage
      - name: Decode all five replays
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          for replay in jobs/fresh-clone-vmage/*/artifacts/data/replay.mp4; do
            ffmpeg -v error -xerror -i "$replay" -f null -
          done
  invariants:
    needs: [static, adapters, harbor, fresh-clone-smoke, fresh-clone-vmage-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          STATIC: ${{ needs.static.result }}
          ADAPTERS: ${{ needs.adapters.result }}
          HARBOR: ${{ needs.harbor.result }}
          SMOKE: ${{ needs.fresh-clone-smoke.result }}
          VMAGE_SMOKE: ${{ needs.fresh-clone-vmage-smoke.result }}
        run: |
          test "$STATIC" = success && test "$ADAPTERS" = success && test "$HARBOR" = success &&
            test "$SMOKE" = success && test "$VMAGE_SMOKE" = success
