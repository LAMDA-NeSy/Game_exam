name: games
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ci_checks/check-games.py
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        benchmark: [common, minigrid, crafter, textworld, babaisai, minihack]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: docker build -f game_first_exam/tests/envs/${{ matrix.benchmark }}.Dockerfile -t game-tests:${{ matrix.benchmark }} .
      - run: docker run --rm -v "$PWD:/repo:ro" game-tests:${{ matrix.benchmark }} bash game_first_exam/tests/run.sh ${{ matrix.benchmark }}
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: harbor run --game-suite minihack-balrog --standard --list
      - run: python game_first_exam/tests/test_game_harbor.py
  invariants:
    needs: [static, adapters, harbor]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          STATIC: ${{ needs.static.result }}
          ADAPTERS: ${{ needs.adapters.result }}
          HARBOR: ${{ needs.harbor.result }}
        run: test "$STATIC" = success && test "$ADAPTERS" = success && test "$HARBOR" = success
